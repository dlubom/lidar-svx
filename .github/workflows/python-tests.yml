name: Python tests

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
    outputs:
      passed:
        value: ${{ jobs.pytest.outputs.passed }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest with Survex
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      passed: ${{ steps.pytest.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          python-version: ${{ inputs.python-version }}
      - name: Install Survex
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends survex
          command -v cavern
          command -v dump3d
      - run: uv sync --locked
      - name: Run tests and enforce coverage
        id: pytest
        run: |
          uv run --no-sync pytest -q --cov
          echo "passed=true" >> "$GITHUB_OUTPUT"
