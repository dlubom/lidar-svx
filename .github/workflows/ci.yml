name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync mypy
      - run: uv build

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          python-version: ${{ matrix.python-version }}
      - name: Install Survex
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends survex
          command -v cavern
          command -v dump3d
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q --cov

  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quality, tests]
    if: ${{ always() }}
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      TESTS_RESULT: ${{ needs.tests.result }}
    steps:
      - name: Require all jobs to succeed
        run: |
          if [[ "$QUALITY_RESULT" != success || "$TESTS_RESULT" != success ]]; then
            printf 'Lint, types and build: %s\nTests: %s\n' "$QUALITY_RESULT" "$TESTS_RESULT"
            exit 1
          fi
