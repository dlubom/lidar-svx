[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-svx"
version = "0.1.0"
description = "Extract a candidate 3D cave survey graph from registered LiDAR returns"
requires-python = ">=3.11"
dependencies = [
    "laspy[lazrs]>=2.5,<3", "numpy>=1.25,<3", "scipy>=1.11,<2",
    "pyproj>=3.6,<4",
]

[project.scripts]
lidar-svx = "lidar_svx.cli:main"

[tool.setuptools]
packages = ["lidar_svx"]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "mypy>=1.19,<3",
    "pytest>=8",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["lidar_svx", "scripts", "tests"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["laspy", "laspy.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["lidar_svx"]

[tool.coverage.report]
fail_under = 85
show_missing = true
